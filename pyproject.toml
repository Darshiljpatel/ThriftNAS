[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thriftnas"
version = "0.1.0"
description = "Efficiency-aware first-order DARTS on CIFAR-10 (IS353IA)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "fvcore>=0.1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thriftnas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
